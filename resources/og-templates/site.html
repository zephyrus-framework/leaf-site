<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #a78bfa;
    --accent-deep: #8b5cf6;
    --text-bright: #fafafa;
    --text: #d4d4d8;
    --text-muted: rgba(212, 212, 216, 0.65);
  }

  body {
    width: 1200px;
    height: 630px;
    background: #08080d;
    font-family: 'Inter', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--text-bright);
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    z-index: 0;
  }

  .bg-scrim {
    position: absolute;
    inset: 0;
    /* Darker in the center where the title sits, lighter at the edges so the
       full hero image stays visible. No separate fade layer at the bottom. */
    background:
      radial-gradient(ellipse 70% 55% at center 42%,
        rgba(8, 8, 13, 0.62) 0%,
        rgba(8, 8, 13, 0.45) 55%,
        rgba(8, 8, 13, 0.25) 100%
      );
    z-index: 1;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 60px),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 60px);
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    z-index: 2;
  }

  .orb-accent {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.18) 0%, transparent 70%);
    filter: blur(80px);
    top: -140px;
    right: -80px;
    z-index: 1;
  }

  .orb-warm {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 180, 100, 0.12) 0%, transparent 70%);
    filter: blur(80px);
    bottom: -100px;
    left: -60px;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 80px;
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 48px;
  }

  .logo {
    height: 72px;
    width: auto;
    filter: drop-shadow(0 4px 24px rgba(167, 139, 250, 0.35));
  }

  .wordmark-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.8;
  }

  .title {
    font-size: 88px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: var(--text-bright);
    margin-bottom: 28px;
    text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
  }

  .title-accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    background: linear-gradient(110deg, #c4b5fd 10%, #a78bfa 50%, #f4a880 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--text-muted);
    max-width: 760px;
    margin: 0 auto;
  }

  .subtitle strong {
    color: var(--text);
    font-weight: 500;
  }

  .footer {
    position: absolute;
    bottom: 40px;
    left: 80px;
    right: 80px;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .footer-left {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }

  .footer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(167, 139, 250, 0.14);
    border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 999px;
    color: var(--accent);
    font-weight: 500;
  }

  .footer-badge::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
  }

  /* Matches the "quietly crafted" title gradient, edge-to-edge across the bottom. */
  .gradient-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #c4b5fd 0%, #a78bfa 50%, #f4a880 100%);
    z-index: 5;
  }
</style>
</head>
<body>
  <img class="bg-image" src="../../public/assets/images/hero-dark.jpg" alt="">
  <div class="bg-scrim"></div>
  <div class="bg-grid"></div>
  <div class="orb-accent"></div>
  <div class="orb-warm"></div>

  <div class="content">
    <div class="wordmark">
      <img src="../../public/assets/images/logo.png" class="logo" alt="">
      <span class="wordmark-text">Zephyrus Leaf</span>
    </div>
    <div class="title">
      Static sites,<br>
      <span class="title-accent">quietly crafted.</span>
    </div>
    <div class="subtitle">
      <strong>Documentation</strong> out of the box. <strong>Anything static</strong>, under the hood.
    </div>
  </div>

  <div class="footer">
    <span class="footer-left">
      <span class="footer-badge">Open source</span>
      <span>MIT licensed</span>
    </span>
    <span>leaf.ophelios.com</span>
  </div>

  <div class="gradient-line"></div>
</body>
</html>
